apiVersion: apps/v1
kind: Deployment
metadata:
  name: spec-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spec-watcher
  template:
    metadata:
      labels:
        app: spec-watcher
    spec:
      containers:
      - name: worker
        image: vigil/worker:latest
        command: ["pnpm", "--filter=@vigil/spec-watcher", "start"]
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: vigil-secrets
              key: redis_url
